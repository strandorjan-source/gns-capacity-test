name: Prepare and verify Capacity languages
on:
  push:
    branches: [feat/capacity-languages]
permissions:
  contents: write
concurrency:
  group: capacity-language-preparation
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://capacity-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_not_a_real_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install isolated source parser
        run: npm install --prefix /tmp/gns-i18n-tools --no-save --package-lock=false @babel/parser@7.26.10
      - name: Localize existing components without changing operational logic
        run: |
          node scripts/localize-once.cjs
          git diff -- app > test-artifacts/localization.patch
      - name: All regression and localization unit tests
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs 2>&1 | tee test-artifacts/unit-tests.txt
      - name: Compile production application and isolated browser fixture
        run: |
          mkdir -p app/i18n-check
          cp tests/fixtures/i18n-check.js app/i18n-check/page.js
          npm run build
      - name: Install browser verification
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      - name: Verify login and complete carrier localization without live database writes
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          bash tests/browser-smoke.sh
          bash tests/i18n-browser.sh
      - name: Save verified sources and remove one-time preparation machinery
        run: |
          rm -rf app/i18n-check
          rm scripts/localize-once.cjs .github/workflows/prepare-capacity-languages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app lib tests scripts/localize-once.cjs .github/workflows/prepare-capacity-languages.yml
          git commit -m 'Integrate and browser-verify seven-language Capacity UI'
          git push origin HEAD:feat/capacity-languages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-language-verification
          path: |
            test-artifacts/
            server.log
          retention-days: 7
